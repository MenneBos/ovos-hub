
x-podman: &podman
  userns_mode: keep-id
  security_opt:
    - "label=disable"

x-logging: &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}
  HSA_OVERRIDE_GFX_VERSION: 11.0.0  # YMMV - I needed this for AMD Radeon RX 7600 XT


x-stt-base: &stt-base
  <<: *podman
  restart: unless-stopped
  logging: *default-logging
  pull_policy: ${PULL_POLICY:-always}
  user: ${MAIN_UID:-1000}:${MAIN_GID:-1000}
  environment:
    <<: *common-environment
  network_mode: host
  # GPU support
  stdin_open: true
  tty: true
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined
  group_add:
    - video
  ipc: host
  devices:
    - /dev/kfd
    - /dev/dri
  # volumes
  volumes:
    - ${CONFIG_BASE_DIR}/mycroft:/home/ovos/.config/mycroft
    - ${DATA_BASE_DIR}/mycroft:/home/ovos/.local/share/mycroft
    - ${CACHE_BASE_DIR}/mycroft:/home/ovos/.cache/mycroft
    - ${STATE_BASE_DIR}/mycroft:/home/ovos/.local/state/mycroft
    - ${TMP_FOLDER}:/tmp/mycroft



services:

  ovos_stt_mynorthai_rocm:
    <<: *stt-base
    build:
      context: ./mynorthai
      dockerfile: Dockerfile.rocm
    container_name: ovos_stt_mynorthai_rocm
    hostname: ovos_stt_mynorthai
    image: jarbasai/ovos-stt-server-mynorthai-rocm:latest
    ports:
      - "9081:8080"
    # TODO - volume for downloaded models

  ovos_stt_hitz_rocm:
    <<: *stt-base
    build:
      context: ./hitz
      dockerfile: Dockerfile.rocm
    container_name: ovos_stt_hitz_rocm
    hostname: ovos_stt_hitz
    image: jarbasai/ovos-stt-server-hitz-rocm:latest
    ports:
      - "9083:8080"
    # TODO - volume for downloaded models

  ovos_stt_whisper_rocm:
    <<: *stt-base
    build:
      context: ./whisper
      dockerfile: Dockerfile.rocm
    container_name: ovos_stt_whisper_rocm
    hostname: ovos_stt_whisper
    image: jarbasai/ovos-stt-server-whisper-rocm:latest
    ports:
      - "9080:8080"
    # TODO - volume for downloaded models
